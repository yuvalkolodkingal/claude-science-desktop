name: Release

# Tag a version to cut a release:  git tag v0.1.0 && git push --tags
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # fpm shells out to rpmbuild for .rpm, and to bsdtar (libarchive-tools)
      # for the pacman target's .MTREE.
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools

      - run: npm ci
      - run: npx electron-builder --linux deb rpm pacman tar.gz --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pacman
            dist/*.tar.gz

  flatpak:
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Build the Flatpak bundle
        run: |
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --noninteractive flathub \
            org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 \
            org.electronjs.Electron2.BaseApp//25.08
          flatpak-builder --disable-rofiles-fuse --repo=repo --force-clean build-dir \
            flatpak/io.github.yuvalkolodkingal.ClaudeScienceDesktop.yml
          flatpak build-bundle repo claude-science-desktop-x86_64.flatpak \
            io.github.yuvalkolodkingal.ClaudeScienceDesktop

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: claude-science-desktop-x86_64.flatpak

  sync-wiki:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Sync docs to wiki
        run: |
          cd docs
          git init wiki
          cd wiki
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          cp ../*.md .
          git add -A
          git commit -m "Update wiki from docs/" || true
          git branch -M master
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git master || \
            echo "Wiki push failed — wiki may need manual initialization via web UI"

  publish:
    needs: [linux, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect assets and checksum them
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS
          ls -lh

      - name: Publish to the release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
          body: |
            Unofficial desktop wrapper for Claude Science — not affiliated with Anthropic.

            No Anthropic code is included in these artifacts. Claude Science is
            downloaded from `downloads.claude.ai` on first run and verified
            against Anthropic's published SHA-256 before it is executed.

            **Install**

            ```bash
            curl -fsSL https://raw.githubusercontent.com/yuvalkolodkingal/claude-science-desktop/main/install.sh | sh
            ```

            Linux only — on macOS use Anthropic's official app:
            https://downloads.claude.ai/claude-science/latest/mac-arm64.dmg

            Verify downloads against `SHA256SUMS`.
