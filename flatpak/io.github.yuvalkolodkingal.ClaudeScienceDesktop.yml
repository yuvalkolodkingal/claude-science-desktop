# Unofficial desktop wrapper for Claude Science. Not affiliated with Anthropic.
#
# Claude Science sandboxes its own agent with bubblewrap, and a Flatpak sandbox
# cannot create the nested user namespace bwrap needs. So the daemon is run on
# the host through flatpak-spawn (--talk-name=org.freedesktop.Flatpak), where
# its own sandbox works; only the Electron UI lives inside this sandbox.
#
# Nothing Anthropic-authored is redistributed: the daemon is downloaded by the
# app itself, on the user's machine, from downloads.claude.ai, and verified
# against Anthropic's published SHA-256.
id: io.github.yuvalkolodkingal.ClaudeScienceDesktop
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: claude-science-desktop
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # The UI talks to the daemon over 127.0.0.1.
  - --share=network
  # Claude Science works on the user's files and keeps state in ~/.claude-science.
  - --filesystem=home
  # Required to start the daemon on the host, where bubblewrap works.
  - --talk-name=org.freedesktop.Flatpak

modules:
  # ---------------------------------------------------------------------------
  # Electron runtime — official upstream build, pinned by checksum.
  # ---------------------------------------------------------------------------
  - name: electron
    buildsystem: simple
    build-commands:
      - mkdir -p /app/electron
      - cp -a . /app/electron
      - chmod 755 /app/electron/electron
    sources:
      - type: archive
        url: https://github.com/electron/electron/releases/download/v43.3.0/electron-v43.3.0-linux-x64.zip
        sha256: f4987e9f045e46b117f0805d6ba4dc524e2abb2c2e33660f175bb39564bd3dae
        strip-components: 0

  # ---------------------------------------------------------------------------
  # The wrapper. Pure Electron main-process JavaScript, no runtime npm deps.
  # ---------------------------------------------------------------------------
  - name: claude-science-desktop
    buildsystem: simple
    build-commands:
      - install -Dm644 main.js /app/lib/claude-science-desktop/main.js
      - install -Dm644 package.json /app/lib/claude-science-desktop/package.json
      - install -Dm644 renderer/loading.html /app/lib/claude-science-desktop/renderer/loading.html
      - python3 scripts/make-icon.py
      - install -Dm644 build/icon.png
        /app/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png
      - install -Dm755 flatpak/claude-science-desktop.sh /app/bin/claude-science-desktop
      - install -Dm644 flatpak/${FLATPAK_ID}.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 flatpak/${FLATPAK_ID}.metainfo.xml
        /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/${FLATPAK_ID}/LICENSE
    sources:
      - type: dir
        path: ..
        skip:
          - node_modules
          - dist
          - vendor
          - .git
          - .flatpak-builder
          - build-dir
          - repo
