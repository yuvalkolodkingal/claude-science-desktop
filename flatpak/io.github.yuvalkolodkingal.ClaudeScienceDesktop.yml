# Unofficial desktop wrapper for Claude Science. Not affiliated with Anthropic.
#
# Nothing Anthropic-authored is redistributed here: the daemon is declared as
# extra-data, so Flathub only stores the URL, size and checksum, and each user's
# machine downloads the official build from downloads.claude.ai at install time.
id: io.github.yuvalkolodkingal.ClaudeScienceDesktop
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: claude-science-desktop
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # The daemon serves its UI on 127.0.0.1 and the wrapper connects to it;
  # Claude Science itself also reaches the network, gated by its own in-app
  # approval cards.
  - --share=network
  # Claude Science works on the user's own data and stores state in
  # ~/.claude-science.
  - --filesystem=home

modules:
  # Note: Claude Science (the daemon) is NOT bundled here. The Electron wrapper
  # downloads Anthropic's official build at first run and verifies its SHA-256.
  # This keeps the Flatpak small and avoids redistributing proprietary code.

  # ---------------------------------------------------------------------------
  # Electron runtime — official upstream build, pinned by checksum.
  # ---------------------------------------------------------------------------
  - name: electron
    buildsystem: simple
    build-commands:
      - mkdir -p /app/electron
      - cp -a . /app/electron
      - chmod 755 /app/electron/electron
    sources:
      - type: archive
        url: https://github.com/electron/electron/releases/download/v43.3.0/electron-v43.3.0-linux-x64.zip
        sha256: f4987e9f045e46b117f0805d6ba4dc524e2abb2c2e33660f175bb39564bd3dae
        strip-components: 0

  # ---------------------------------------------------------------------------
  # The wrapper. Pure Electron main-process JavaScript, no npm dependencies at
  # runtime, so there is nothing to vendor.
  # ---------------------------------------------------------------------------
  - name: claude-science-desktop
    buildsystem: simple
    build-commands:
      - install -Dm644 main.js /app/lib/claude-science-desktop/main.js
      - install -Dm644 package.json /app/lib/claude-science-desktop/package.json
      - install -Dm644 renderer/loading.html /app/lib/claude-science-desktop/renderer/loading.html
      - python3 scripts/make-icon.py
      - install -Dm644 build/icon.png
        /app/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png
      - install -Dm755 flatpak/claude-science-desktop.sh /app/bin/claude-science-desktop
      - install -Dm644 flatpak/${FLATPAK_ID}.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 flatpak/${FLATPAK_ID}.metainfo.xml
        /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
    sources:
      - type: git
        url: https://github.com/yuvalkolodkingal/claude-science-desktop.git
        tag: v0.1.0
